name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/neupane07/expense-tracker-api
  WEB_IMAGE: ghcr.io/neupane07/expense-tracker-web

jobs:
  deploy:
    name: Publish images and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.expense.hbkbimal.xyz
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /opt/apps/expense
            export API_IMAGE_TAG=${{ github.sha }}
            export WEB_IMAGE_TAG=${{ github.sha }}
            docker compose config --services | grep -qx expense-worker || { echo 'Install the updated deploy/docker-compose.prod.yml as /opt/apps/expense/compose.yml before deploying.'; exit 1; }
            docker compose pull
            docker compose run --rm --no-deps api node -e 'const e = process.env; const valid = (v) => /^[a-f0-9]{64}$/i.test(v || ""); if (!valid(e.EXPENSE_DATA_KEY)) { console.error("Configure EXPENSE_DATA_KEY before deploying; existing keys must not be regenerated."); process.exit(1); } if (e.EXPENSE_GMAIL_ENABLED === "true" && (!valid(e.EXPENSE_TOKEN_KEY) || e.EXPENSE_TOKEN_KEY === e.EXPENSE_DATA_KEY || !e.EXPENSE_GOOGLE_CLIENT_ID || !e.EXPENSE_GOOGLE_CLIENT_SECRET || !e.EXPENSE_GOOGLE_CALLBACK_URL)) { console.error("Complete the separate expense-mail OAuth settings and independent token key before enabling Gmail."); process.exit(1); }'
            docker compose stop api web expense-worker
            docker compose up -d postgres
            docker compose run --rm api ./apps/api/node_modules/.bin/prisma migrate deploy --config apps/api/prisma.config.ts
            docker compose up -d --wait --wait-timeout 90
            docker image prune -f
